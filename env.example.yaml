# Copy to env.yaml and fill in. env.yaml is gitignored; app.yaml includes it on deploy.
env_variables:
  NODE_ENV: "production"
  TRUST_PROXY: "1"

  # TiDB Cloud: Cluster > Connect (choose "General" / Node.js)
  DB_HOST: "gateway01.<region>.prod.aws.tidbcloud.com"
  DB_PORT: "4000"
  DB_USER: "<prefix>.root"
  DB_PASSWORD: ""
  DB_NAME: "receiptor_db"
  DB_SSL: "true"

  JWT_SECRET: ""
  JWT_EXPIRES_IN: "7d"

  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
  CLOUDINARY_FOLDER: "receiptor/logos"

  # App Engine blocks outbound port 25; 465 or 587 work.
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "465"
  SMTP_USER: ""
  SMTP_PASS: ""
  SUPPORT_INBOX: ""
