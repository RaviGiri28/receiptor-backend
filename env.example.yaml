# Copy to env.yaml and fill in. env.yaml is gitignored; app.yaml includes it on deploy.
env_variables:
  NODE_ENV: "production"
  TRUST_PROXY: "1"

  # TiDB Cloud: Cluster > Connect (choose "General" / Node.js)
  DB_HOST: "gateway01.<region>.prod.aws.tidbcloud.com"
  DB_PORT: "4000"
  DB_USER: "<prefix>.root"
  DB_PASSWORD: ""
  DB_NAME: "receiptor_db"
  DB_SSL: "true"

  JWT_SECRET: ""
  JWT_EXPIRES_IN: "7d"

  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
  CLOUDINARY_FOLDER: "receiptor/logos"
  CLOUDINARY_BLOG_FOLDER: "receiptor/blog"
  # Login emails (comma-separated) that can publish blog posts and announcements.
  ADMIN_EMAILS: ""

  # Email: Brevo HTTP API (BREVO_*) or SMTP. App Engine blocks outbound port 25; 465 or 587 work.
  BREVO_API_KEY: ""
  BREVO_SENDER: ""
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "465"
  SMTP_USER: ""
  SMTP_PASS: ""
  SUPPORT_INBOX: ""
  # Daily data-retention run: GET /api/internal/retention with header X-Internal-Token.
  INTERNAL_TASK_TOKEN: ""
